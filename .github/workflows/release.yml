name: Release

on:
  push:
    tags: ['v[0-9]*']
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package-linux.sh'
      - 'scripts/smoke-release.sh'
      - 'src/data_path.rs'
      - 'RELEASES.md'
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.93.1
  RAYON_NUM_THREADS: 4

jobs:
  linux:
    name: Linux x86_64 CLI and GUI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liblcms2-dev libfontconfig1-dev libgexiv2-2 liblensfun1 xvfb xauth ripgrep jq
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-rust-1.93.1-${{ hashFiles('Cargo.lock') }}
      - name: Resolve and validate version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fast-spektrafilm") | .version')
          tag="v$version"
          if [[ "$REF" == refs/tags/* && "$REF_NAME" != "$tag" ]]; then
            echo "Tag $REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Verify pinned measurement assets and derived tables
        run: python3 tools/check_baseline.py
      - name: Build optimized CLI and GUI
        # One Cargo job bounds memory during thin LTO of the Slint application.
        run: cargo build --release --locked --features gui --bins -j1
      - name: Test the release profile
        run: cargo test --release --locked --features gui -j1
      - name: Package binaries, original data, licenses and matching source
        run: bash scripts/package-linux.sh "$RELEASE_TAG"
      - name: Test the unpacked release outside the checkout
        run: bash scripts/smoke-release.sh "artifacts/release/dist/fast-spektrafilm-${RELEASE_TAG#v}-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: artifacts/release/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-linux-x86_64
          path: artifacts/release/dist
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts/release/dist
          sha256sum -c SHA256SUMS
          notes="$GITHUB_WORKSPACE/releases/$RELEASE_TAG.md"
          test -f "$notes"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --verify-tag --draft \
              --title "fast-spektrafilm $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
